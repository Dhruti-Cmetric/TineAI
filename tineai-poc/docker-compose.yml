version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tineai
      POSTGRES_PASSWORD: tineai123
      POSTGRES_DB: tineai_poc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://tineai:tineai123@db:5432/tineai_poc
      SECRET_KEY: super-secret-poc-key-change-in-prod
      UPLOAD_DIR: /uploads
    volumes:
      - uploads:/uploads
    command: ["sh", "-c", "sleep 3 && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
