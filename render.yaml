services:
  # ---------------------------------------------------------------------------
  # TINE AI Backend Web Service (FastAPI + Hugging Face Pipeline)
  # ---------------------------------------------------------------------------
  - type: web
    name: tineai-backend
    runtime: python
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tineai-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"

  # ---------------------------------------------------------------------------
  # TINE AI Frontend Static Site (React + Vite SPA)
  # ---------------------------------------------------------------------------
  - type: static
    name: tineai-frontend
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tineai-backend
          property: host

databases:
  # ---------------------------------------------------------------------------
  # TINE AI Managed PostgreSQL Database
  # ---------------------------------------------------------------------------
  - name: tineai-postgres
    databaseName: tineai
    user: tineai
    plan: free
    region: oregon
